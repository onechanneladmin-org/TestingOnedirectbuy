name: Deploy OneTest (GKE)

on:
  push:
    branches:
      - cicd-prod
  workflow_dispatch:

concurrency:
  group: deploy-onetest-gke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy to GKE
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker --quiet

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: oneautobackend
          location: us-east1-b
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build Docker Image
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/onetest:latest"
          docker pull "$IMAGE" || true
          docker build --cache-from "$IMAGE" -t "$IMAGE" -f Dockerfile .

      - name: Push Docker Image
        run: |
          docker push "gcr.io/${{ secrets.GCP_PROJECT_ID }}/onetest:latest"

      - name: Rollout Restart in GKE
        run: |
          kubectl rollout restart deployment onetest -n default
          echo "Rollout restart triggered successfully!"
