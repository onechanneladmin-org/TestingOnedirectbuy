name: Deploy OneTest (GKE)

# Manual only (owner 2026-10-21): the testing app runs locally; nothing deploys on push to cicd-prod.
on:
  workflow_dispatch:

concurrency:
  group: deploy-onetest-gke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy to GKE
    runs-on: arc-runner-set
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Move the GCP key file out of the workspace (keeps it out of docker build contexts)
        # google-github-actions/auth writes gha-creds-*.json into $GITHUB_WORKSPACE; `docker build .`
        # would copy it into the image. Move it to $RUNNER_TEMP and repoint the env vars the auth
        # action exported (its post step still deletes the file via GOOGLE_GHA_CREDS_PATH).
        shell: bash
        run: |
          shopt -s nullglob
          for f in "$GITHUB_WORKSPACE"/gha-creds-*.json; do
            dest="$RUNNER_TEMP/$(basename "$f")"
            mv -f "$f" "$dest"
            { echo "GOOGLE_APPLICATION_CREDENTIALS=$dest"; echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$dest"; echo "GOOGLE_GHA_CREDS_PATH=$dest"; } >> "$GITHUB_ENV"
          done

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker --quiet

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: oneautobackend
          location: us-east1-b
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build Docker Image
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT_ID }}/onetest:latest"
          docker pull "$IMAGE" || true
          docker build --cache-from "$IMAGE" -t "$IMAGE" -f Dockerfile .

      - name: Push Docker Image
        run: |
          docker push "gcr.io/${{ secrets.GCP_PROJECT_ID }}/onetest:latest"

      - name: Rollout Restart in GKE
        run: |
          kubectl rollout restart deployment onetest -n default
          echo "Rollout restart triggered successfully!"
