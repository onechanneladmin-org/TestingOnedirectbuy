<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      body {
        margin: 0;
        background: #fff;
        color: #111;
        font: 16px Arial, sans-serif;
      }
      main { padding: 16px; max-width: 720px; }
      a { color: #0b3a82; display: inline-block; padding: 8px 12px; }
      button, input {
        font: 16px Arial, sans-serif;
        color: #111;
        background: #f4f4f4;
        border: 1px solid #bbb;
        height: 40px;
        min-width: 88px;
      }
      label { display: block; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Orders</h1>
      <p>Open orders for the selected seller account.</p>
      <nav>
        <a href="#/orders">Orders</a>
      </nav>
      <form>
        <label for="query">Search orders</label>
        <input id="query" name="query" />
      </form>
      <button type="button">Save changes</button>
      <img
        alt="Seller logo"
        width="32"
        height="32"
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
      />
    </main>
  </body>
</html>
